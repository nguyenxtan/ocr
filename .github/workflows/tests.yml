name: tests
on:
  push:
  pull_request:
jobs:
  unit-and-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Build Docker image
        run: docker build -t ocr-poc:ci .
