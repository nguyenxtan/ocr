name: Performance source snapshot
on:
  push:
    branches: [perf/telegram-output-latency]
    paths: [.github/workflows/perf-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source only
        run: git archive --format=zip -o source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: perf-source
          path: source.zip
          retention-days: 1
